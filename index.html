
function printLastInvoice(){
  let s=lastInvoice||db.sales[0];
  if(!s)return alert('अहिलेसम्म बिक्री बिल छैन');

  let w=window.open('','_blank');
  if(!w)return alert('Popup अनुमति दिनुहोस्');

  w.document.write(
    '<!doctype html><html><head><meta charset="utf-8"><title>Invoice</title></head><body>'+
    invoiceHTML(s)+
    '</body></html>'
  );

  w.document.close();
  w.focus();
  w.print();
}
